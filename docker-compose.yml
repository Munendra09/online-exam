version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ltaexam-db
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ltaexam-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.local
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ltaexam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"

volumes:
  db_data:
